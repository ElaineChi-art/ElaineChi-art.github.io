<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>✍️ 題型擬答 ‧ 司法官律師平台</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2833;--sub:#5d6d7e;--line:#e5e8e8;--acc:#1b4f72;--red:#7b241c;--gold:#7d6608}
@media(prefers-color-scheme:dark){:root{--bg:#151a1f;--card:#1d242b;--ink:#e8eef3;--sub:#9fb0bf;--line:#2c353d;--acc:#5dade2;--red:#e59a92;--gold:#d4ac0d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.85 -apple-system,"PingFang TC","Noto Sans TC",serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0 0 8px;font-size:17px}
h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}
#q{flex:1;min-width:160px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#jump{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);max-width:60%}
.wrap{display:flex;gap:0;align-items:flex-start;max-width:1680px;margin:0 auto}
#toc{position:sticky;top:96px;flex:0 0 268px;max-height:calc(100vh - 130px);overflow:auto;
padding:10px 8px 20px 14px;border-right:1px solid var(--line);font-size:calc(13px * var(--sc,1))}
#toc .tch{font-weight:700;color:#fff;background:var(--acc);padding:5px 9px;border-radius:5px;margin:12px 0 6px;font-size:12.6px}
#toc .tsec{font-weight:700;color:var(--acc);margin:9px 0 3px;font-size:12.6px}
#toc a{display:block;padding:4px 7px 4px 12px;color:var(--sub);text-decoration:none;border-left:2px solid transparent;border-radius:0 5px 5px 0;line-height:1.5}
#toc a:hover{background:rgba(93,173,226,.13);color:var(--ink)}
#toc a.on{border-left-color:var(--red);color:var(--red);font-weight:700;background:rgba(123,36,28,.08)}
#toc .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;opacity:.75;margin-right:4px}
main{flex:1;min-width:0;padding:12px 34px 92px 22px}
#tocbtn{display:none}
@media(max-width:880px){
 #toc{position:fixed;left:0;top:0;bottom:0;z-index:40;width:80%;max-width:310px;max-height:none;
 background:var(--card);box-shadow:0 0 30px rgba(0,0,0,.35);transform:translateX(-102%);transition:.25s;padding-top:16px}
 #toc.open{transform:none}
 #tocbtn{display:inline-block;padding:6px 11px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}
 main{padding-bottom:96px}
}
.ch{margin:26px 0 8px;font-weight:700;color:#fff;background:var(--acc);padding:8px 13px;border-radius:7px;font-size:15px}
.sec{margin:16px 0 6px;font-weight:700;color:var(--acc);background:rgba(93,173,226,.13);padding:6px 12px;border-radius:6px;font-size:14px}
.tp{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:9px;padding:12px 15px;margin:12px 0}
.tt{font-weight:700;font-size:calc(15.5px * var(--sc,1));color:var(--red);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.lead{text-indent:2em;margin:8px 0 12px;font-size:calc(14.6px * var(--sc,1))}
.h1x{font-weight:700;color:var(--acc);margin:14px 0 6px;font-size:calc(14.8px * var(--sc,1))}
.h2x{font-weight:700;margin:10px 0 4px 1.4em;font-size:calc(14.4px * var(--sc,1))}
.p{text-indent:2em;margin:6px 0 6px 1.4em;font-size:calc(14.4px * var(--sc,1))}
.p.d2{margin-left:2.8em}
.tip{background:rgba(212,172,13,.12);border-left:3px solid var(--gold);padding:8px 12px;margin:12px 0 2px;font-size:13.3px;color:var(--gold);border-radius:0 6px 6px 0}
b.kk{color:#c0392b;font-weight:700}
body.nokk b.kk{color:inherit;font-weight:inherit}
@media(prefers-color-scheme:dark){b.kk{color:#ec7063}}
.play{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px;color:var(--sub);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:30;flex-wrap:wrap}
.bar b{font-size:12.5px;color:var(--sub);font-weight:500}
.bar button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
.bar button.p2{background:var(--acc);color:#fff;border-color:var(--acc)}
.mini{font-size:12px;color:var(--sub)}
.now{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.btns{display:flex;gap:5px;align-items:center;white-space:nowrap;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.btns .tb{flex:0 0 auto}
.tt>span:first-child{min-width:0}
#allsd{padding:5px 11px;font-size:12.5px}
.sbj{padding:6px 15px;border:1px solid var(--line);background:transparent;border-radius:20px;cursor:pointer;font-size:13.5px}
.sbj.on{background:var(--red);color:#fff;border-color:var(--red)}
.tb{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;color:var(--sub)}
.tb.on{background:var(--red);color:#fff;border-color:var(--red)}
.sd{margin-top:6px}
.sd .r{display:flex;gap:7px;margin:5px 0;align-items:flex-start}
.sd .lb{flex:0 0 auto;width:23px;height:20px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sd .bd{flex:1;font-size:calc(14.3px * var(--sc,1));line-height:1.75}
.L爭{background:#8e6c1a}.L據{background:#566573}.L實{background:#2b5f8f}.L說{background:#2e7d52}
.L採{background:#7d3c98}.L攝{background:#117864}.L結{background:#b03a2e}.L訣{background:#7d6608}
.sd .r.k訣 .bd{background:rgba(212,172,13,.13);padding:6px 10px;border-radius:6px;font-size:13.2px}
.tools{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px;padding:6px 8px;background:rgba(93,173,226,.09);border-radius:7px}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12.5px}
.body[contenteditable="true"]{outline:2px dashed var(--acc);outline-offset:6px;border-radius:6px;background:rgba(93,173,226,.04)}
.note{margin-top:10px}
.note{position:relative}
.secnote{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);
border-radius:9px;padding:11px 14px;margin:14px 0 26px}
.secnote .hd{font-size:12.6px;color:var(--gold);font-weight:700}
.secnote .nb{min-height:70px}
@media(prefers-color-scheme:dark){.secnote{background:rgba(212,172,13,.06)}}
.nb{width:100%;min-height:62px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
background:var(--bg);color:var(--ink);font:inherit;font-size:calc(13.6px * var(--sc,1));line-height:1.75;
overflow:hidden;transition:max-height .18s;outline:none}
.nb:focus{border-color:var(--acc)}
.nb:empty:before{content:attr(data-ph);color:var(--sub);opacity:.7}
.nb img{max-width:min(100%,var(--imgw,320px));max-height:var(--imgh,260px);height:auto;width:auto;
object-fit:contain;border-radius:7px;margin:6px 6px 6px 0;display:inline-block;vertical-align:top;
cursor:zoom-in;border:1px solid var(--line)}
.note.clip .nb{max-height:120px;overflow:auto}
#lbx{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#lbx img{max-width:96vw;max-height:92vh;border-radius:8px}
.note.clip:after{content:"";position:absolute;left:1px;right:1px;bottom:4px;height:34px;pointer-events:none;
background:linear-gradient(to bottom,transparent,var(--card))}
.note .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note .tg2{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 10px;
cursor:pointer;font-size:12px;color:var(--sub);white-space:nowrap}
.note .hd{font-size:12px;color:var(--sub);margin-bottom:3px}
.edited{font-size:11px;color:var(--gold);margin-left:6px}

/* ── 多益 TOEIC ── */
.tew .pt{margin:16px 0 4px;padding:6px 11px;background:linear-gradient(90deg,rgba(155,29,45,.14),transparent);border-left:4px solid var(--red);border-radius:0 6px 6px 0;font-weight:700;color:var(--acc);font-size:calc(15px * var(--sc,1))}
.tew .pt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tew .pt .pb{flex:0 0 auto;font-size:11.5px;font-family:system-ui;font-weight:400;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:inherit;cursor:pointer;white-space:nowrap}
.tew .pt .pb:hover{border-color:var(--red);color:var(--red)}
.tew .pt.on{box-shadow:inset 0 0 0 1px var(--red)}
.tew .pt.on .pb{background:var(--red);color:#fff;border-color:var(--red)}
.tew .doc{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:9px 13px;margin:8px 0 4px;background:rgba(127,140,141,.06);font-family:Georgia,serif}
.tew .doc .dt{font-weight:700;letter-spacing:.06em;font-size:calc(13.6px * var(--sc,1));margin-bottom:3px}
.tew .doc .dl{font-size:calc(13.2px * var(--sc,1));line-height:1.72;opacity:.9}
.tew .pin{margin:2px 0 8px 4px;font-size:calc(13.4px * var(--sc,1));opacity:.82}
.tew .seg{margin:6px 0 14px;border-left:2px dashed var(--line);padding-left:11px}
.tew .sh{cursor:pointer;margin:9px 0 5px;font-size:calc(14px * var(--sc,1));color:var(--acc);user-select:none}
.tew .sh b{font-weight:700}
.tew .sh .xc{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:7px;opacity:.62;white-space:nowrap}
.tew .seg.op .sh .xc,.tew.xall .sh .xc{opacity:.95;border-color:var(--red);color:var(--red)}
.tew .en{display:flex;gap:8px;margin:7px 0 2px;cursor:pointer;border-radius:6px;padding:3px 5px}
.tew .en:hover{background:rgba(155,29,45,.06)}
.tew .en .sp{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;background:var(--acc);border-radius:4px;padding:2px 7px;height:19px;line-height:15px;margin-top:3px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.tew .en .et{flex:1;font-size:calc(15.2px * var(--sc,1));line-height:1.72;font-family:Georgia,"Times New Roman",serif}
.tew .zx{margin:0 0 6px 62px;font-size:calc(13.6px * var(--sc,1));line-height:1.7;opacity:.88;border-left:2px solid var(--gold);padding-left:9px}
.tew .voc{margin:8px 0 4px;background:rgba(127,140,141,.07);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.tew .voc .vt{font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:5px}
.tew .voc .v{margin:7px 0;padding-bottom:6px;border-bottom:1px dotted var(--line)}
.tew .voc .v:last-child{border-bottom:0;padding-bottom:0}
.tew .voc .vw b{font-family:Georgia,serif;font-size:calc(14.4px * var(--sc,1));color:#c0392b}
.tew .voc .vw i{font-style:normal;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 6px;opacity:.75}
.tew .voc .vw span{font-size:calc(13.4px * var(--sc,1))}
.tew .voc .vs,.tew .voc .vp,.tew .voc .vr{font-size:calc(12.8px * var(--sc,1));margin-top:3px;line-height:1.65;padding-left:10px}
.tew .voc .vs{color:var(--acc)}.tew .voc .vp{opacity:.85}
.tew .voc .vr{color:#c0392b;font-weight:600}
@media(prefers-color-scheme:dark){.tew .voc .vw b,.tew .voc .vr{color:#ec7063}}
.tew .zx,.tew .voc,.tew .seg .tip{display:none}
.tew .seg.op .zx,.tew .seg.op .voc,.tew .seg.op .tip{display:block}
.tew.xall .zx,.tew.xall .voc,.tew.xall .tip{display:block}
.tew .en.op + .zx{display:block}
.cmp{margin-top:4px}
.cmpt{font-weight:700;color:var(--acc);font-size:calc(14.8px * var(--sc,1));margin:2px 0 8px;line-height:1.55}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:10px 0;border-top:1px dashed var(--line)}
.crow.chd{border-top:0;padding:0 0 4px}
.crow.chd .cc{background:none;padding:0}
.crow.chd span{font-size:12px;font-weight:700;letter-spacing:.03em}
.crow.chd .cc.l span{color:var(--red)}
.crow.chd .cc.r span{color:var(--gold)}
.cc{min-width:0}
.cc.r{background:rgba(212,172,13,.08);border-radius:8px;padding:8px 11px}
.clab{font-size:11.8px;font-weight:700;color:var(--acc);margin-bottom:4px;opacity:.9}
.cc.r .clab{color:var(--gold)}
.cp{font-size:calc(14.2px * var(--sc,1));line-height:1.8;margin:5px 0}
.ci{font-size:calc(14.2px * var(--sc,1));line-height:1.8;margin:6px 0;padding-left:10px;border-left:2px solid var(--line)}
.cc.r .ci{border-left-color:var(--gold)}
.ch2{font-weight:700;font-size:calc(12.6px * var(--sc,1));color:var(--acc);opacity:.78;margin:9px 0 2px;letter-spacing:.02em}
.cp.d1,.ci.d1{margin-left:12px}
.cp.d2,.ci.d2{margin-left:24px;font-size:calc(13.6px * var(--sc,1))}
.cs{display:block;color:var(--acc);margin-bottom:1px}
.cc.r .cs{color:var(--gold)}
.hl{background:linear-gradient(transparent 55%,rgba(241,196,15,.62) 55%);color:inherit;padding:0 1px;border-radius:2px;font-weight:600}
body.nokk .hl{background:none;font-weight:inherit}
.cc.r .hl{background:linear-gradient(transparent 55%,rgba(46,134,193,.34) 55%)}
@media(prefers-color-scheme:dark){.hl{background:linear-gradient(transparent 55%,rgba(241,196,15,.34) 55%)}
  .cc.r .hl{background:linear-gradient(transparent 55%,rgba(93,173,226,.32) 55%)}}
#allcmp.on{background:var(--gold);border-color:var(--gold);color:#3a2f00}
.tb.cmb.on{background:var(--gold);color:#3a2f00;border-color:var(--gold)}
@media(max-width:860px){.crow{grid-template-columns:1fr;gap:8px}.crow.chd{display:none}}
.vov{display:none;border:1px solid var(--line);border-radius:9px;margin:10px 0 2px;background:rgba(127,140,141,.05)}
.vov.open{display:block}
.vov .vhd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.6px;font-weight:700;color:var(--acc)}
.vov .vbody{padding:6px 12px 11px;max-height:62vh;overflow-y:auto}
.vov .vpt{font-size:11.8px;font-weight:700;color:var(--acc);opacity:.85;margin:10px 0 3px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.vov .vrow{margin:6px 0;padding-bottom:5px;border-bottom:1px dotted var(--line)}
.vov .vrow:last-child{border-bottom:0}
.vov .vw b{font-family:Georgia,serif;font-size:calc(14.6px * var(--sc,1));color:#c0392b}
.vov .vw i{font-style:normal;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 6px;opacity:.75}
.vov .vw span.zh{font-size:calc(13.4px * var(--sc,1))}
.vov .vs,.vov .vtip,.vov .vr{font-size:calc(12.6px * var(--sc,1));margin-top:2px;line-height:1.62;padding-left:10px}
.vov .vs{color:var(--acc)}.vov .vtip{opacity:.85}.vov .vr{color:#c0392b;font-weight:600}
.vov.nozh .zh{display:none}
.vov.nozh .vrow{cursor:pointer;border-radius:5px}
.vov.nozh .vrow:hover{background:rgba(155,29,45,.06)}
.vov.nozh .vrow.on .zh{display:block}
.vov.nozh .vrow.on span.zh{display:inline}
.tb.vbb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(prefers-color-scheme:dark){.vov .vw b,.vov .vr{color:#ec7063}}
.tb.star{padding:4px 9px;font-size:14px;line-height:1}
.tb.star.on{color:#f1c40f;border-color:#f1c40f;background:rgba(241,196,15,.12)}
#onlystar.on{background:#f1c40f;border-color:#f1c40f;color:#4a3b00}
#toc a .stm{color:#f1c40f;margin-left:4px}
.tb.xpb.on{background:var(--red);color:#fff;border-color:var(--red)}
.sdte .tvt{font-weight:700;color:var(--acc);margin:14px 0 7px;font-size:calc(14.6px * var(--sc,1));border-bottom:1px solid var(--line);padding-bottom:4px}
.sdte .tree{white-space:pre;overflow-x:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:calc(12.4px * var(--sc,1));line-height:1.85;background:rgba(127,140,141,.07);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin:0}
.sdte .qz{border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin:9px 0}
.sdte .qq{font-family:Georgia,serif;font-size:calc(14.4px * var(--sc,1));line-height:1.7;margin-bottom:6px}
.sdte .qn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-family:system-ui;align-items:center;justify-content:center;margin-right:7px;vertical-align:1px}
.sdte .qo{font-family:Georgia,serif;font-size:calc(13.8px * var(--sc,1));margin:2px 0 2px 27px}
.sdte .qa{margin:7px 0 0 27px;font-size:12px;padding:3px 11px;border-radius:20px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.sdte .qx{display:none;margin:7px 0 0 27px;font-size:calc(13px * var(--sc,1));line-height:1.72}
.sdte .qz.op .qx{display:block}
.sdte .qans{color:#1e8449;font-weight:700}
.sdte .qzh{opacity:.85;margin-top:2px}
.sdte .qe{margin-top:3px;background:rgba(212,172,13,.12);border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0}

</style></head><body>
<header>
<h1>✍️ <span id="subjname">行政法</span><span id="subjmode">擬答</span><small id="subjsub">上榜答題體例　按…次按…查本案中…綜上所述　共 <span id="tot">—</span> 題</small></h1>
<div class="row" style="margin-bottom:6px">
<button class="sbj on" data-s="xz">行政法</button><button class="sbj" data-s="ms">民事訴訟法</button><button class="sbj" data-s="te">多益 TOEIC</button>
</div>
<div class="row">
<button id="tocbtn">☰ 目錄</button>
<button id="allsd" class="tb">⚡ 全部速讀</button>
<button id="allcmp" class="tb">⚖ 全部對照</button>
<button id="kk" class="tb">🔴 重點紅字</button>
<button id="onlystar" class="tb">⭐ 只看星號</button>
<input id="q" placeholder="搜尋題型、條號、關鍵字…">
<span class="mini" id="cnt"></span>
</div>
</header>
<div class="wrap"><nav id="toc"></nav><main id="app"></main></div>
<div class="bar">
<button id="pp" class="p2">▶ 朗讀全部</button>
<button id="stop">■ 停</button>
<b>語速</b><span class="mini" id="ratev" style="min-width:38px;display:inline-block"></span><input id="rate" type="range" min="0.8" max="2" step="0.05" value="1.3" style="width:88px">
<b>聲音</b><select id="voice" style="max-width:148px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg)"></select>

<script>
const CN="一二三四五六七八九十";
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
let KEYRE=null;
function setKeys(code){
  const ks=((KEYD()[code])||[]).slice().sort((a,b)=>b.length-a.length);
  KEYRE = ks.length ? new RegExp("("+ks.map(esc).map(reEsc).join("|")+")","g") : null;
}
/* 擬答版：標紅（＝該題速讀版的內容）；速讀版與標題：不標 */
function rich(s){ const h=esc(s); return KEYRE? h.replace(KEYRE,'<b class="kk">$1</b>') : h; }
function plain(s){ return esc(s); }
let kw="";
const mk=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="kk">$1</b>');
function teHTML(t,mode){
  if(mode==="sd"){
    const d=SUDUD()[t.code];
    if(!d)return '<div class="empty" style="padding:22px 0">此單元速讀版尚未製作</div>';
    let h='<div class="sdte"><div class="tvt">🌲 樹枝狀圖　全單元考點骨架</div><pre class="tree">'+mk(d.tree)+'</pre>';
    h+='<div class="tvt">✍️ 實戰模擬測驗　共 '+(d.quiz||[]).length+' 題</div>';
    (d.quiz||[]).forEach((q,i)=>{
      h+='<div class="qz"><div class="qq"><span class="qn">'+(i+1)+'</span>'+mk(q.q)+'</div>';
      (q.o||[]).forEach(([a,b])=>{h+='<div class="qo">('+esc(a)+')　'+esc(b)+'</div>';});
      h+='<button class="qa">▾ 顯示答案與解析</button><div class="qx">'+
         '<div class="qans">✅ 正確答案　'+esc(q.a)+'</div>'+
         (q.zh?'<div class="qzh">中譯　'+esc(q.zh)+'</div>':'')+
         (q.e?'<div class="qe">防雷解析　'+esc(q.e)+'</div>':'')+'</div></div>';
    });
    return h+'</div>';
  }
  const xp=localStorage.getItem("nidax_"+t.code)==="1";
  let h='<div class="tew'+(xp?" xall":"")+'">',op=false,pi=0;
  t.items.forEach(it=>{
    if(it.k==="lead")h+='<div class="lead">'+esc(it.t)+'</div>';
    else if(it.k==="h1"){if(op){h+='</div>';op=false;}pi++;
      h+='<div class="pt" id="pt-'+esc(t.code)+'-'+pi+'"><span>'+esc(it.ic||"")+' '+esc(it.t)+'</span>'+
         '<button class="pb" data-code="'+esc(t.code)+'" data-p="'+pi+'">🔊 念這個 Part</button></div>';}
    else if(it.k==="p")h+='<div class="pin">'+esc(it.t)+'</div>';
    else if(it.k==="doc")h+='<div class="doc">'+(it.v||[]).map(x=>'<div class="'+(x.k==="t"?"dt":"dl")+'">'+esc(x.v)+'</div>').join("")+'</div>';
    else if(it.k==="h2"){if(op)h+='</div>';op=true;
      h+='<div class="seg"><div class="sh">'+esc(it.ic||"")+' <b>'+esc(it.t)+'</b>　'+esc(it.d||"")+'<span class="xc">＋解析</span></div>';}
    else if(it.k==="tip")h+='<div class="tip">本段考點　'+esc(it.t)+'</div>';
    else if(it.k==="en")h+='<div class="en"><span class="sp">'+esc(it.sp)+'</span><span class="et">'+mk(it.t)+'</span></div><div class="zx">'+esc(it.zh)+'</div>';
    else if(it.k==="voc"){h+='<div class="voc"><div class="vt">📝 核心字彙與考點解密</div>';
      (it.v||[]).forEach(v=>{h+='<div class="v"><div class="vw"><b>'+esc(v.w)+'</b>'+(v.pos?'<i>'+esc(v.pos)+'</i>':'')+(v.zh?'<span>'+esc(v.zh)+'</span>':'')+'</div>'+
        (v.syn?'<div class="vs">同義代換　'+esc(v.syn)+'</div>':'')+
        (v.tip?'<div class="vp">解題技巧　'+esc(v.tip)+'</div>':'')+
        (v.trap?'<div class="vr">⚠ 防雷陷阱　'+esc(v.trap)+'</div>':'')+'</div>';});
      h+='</div>';}
  });
  if(op)h+='</div>';
  return h+'</div>';

function vocList(t){
  const out=[],seen={}; let pi=0,pn="";
  (t.items||[]).forEach(it=>{
    if(it.k==="h1"){pi++;pn=it.t;}
    else if(it.k==="voc")(it.v||[]).forEach(v=>{
      const k=(v.w||"").toLowerCase().trim(); if(!k||seen[k])return; seen[k]=1;
      out.push(Object.assign({},v,{p:pi,pn:pn}));});
  });
  return out;
}
function vocPanel(t){
  const L=vocList(t); if(!L.length)return "";
  const open=localStorage.getItem("nidavoc_"+t.code)==="1";
  const nozh=localStorage.getItem("nida_te_nozh")==="1";
  let h='<div class="vov'+(open?" open":"")+(nozh?" nozh":"")+'" data-code="'+esc(t.code)+'">'+
    '<div class="vhd"><span>📝 核心字彙總覽　'+L.length+' 組</span>'+
    '<span><button class="tg2 zhtg">'+(nozh?"👁 顯示中文":"🙈 隱藏中文")+'</button></span></div>'+
    '<div class="vbody">';
  let last=-1;
  L.forEach(v=>{
    if(v.p!==last){last=v.p;h+='<div class="vpt">'+esc(v.pn)+'</div>';}
    h+='<div class="vrow"><div class="vw"><b>'+esc(v.w)+'</b>'+(v.pos?'<i>'+esc(v.pos)+'</i>':'')+
       (v.zh?'<span class="zh">'+esc(v.zh)+'</span>':'')+'</div>'+
       (v.syn?'<div class="vs">同義代換　'+esc(v.syn)+'</div>':'')+
       (v.tip?'<div class="vtip zh">'+esc(v.tip)+'</div>':'')+
       (v.trap?'<div class="vr zh">⚠ 防雷陷阱　'+esc(v.trap)+'</div>':'')+'</div>';
  });
  return h+'</div></div>';
}
let CKRE=null;
function setCmpKeys(code){
  const ks=((((CUR().CK?CUR().CK():{})[code])||[])).slice().sort((a,b)=>b.length-a.length);
  CKRE = ks.length ? new RegExp("("+ks.map(esc).map(reEsc).join("|")+")","g") : null;
}
/* 字元層級上標：先拆出粗體旗標，再比對螢光句（可跨越粗體），最後依區段輸出，標籤保證正確巢套 */
function mkHL(t,hl){
  const ch=[],bd=[]; let i=0,b=false;
  while(i<t.length){
    if(t[i]==="*"&&t[i+1]==="*"){b=!b;i+=2;continue;}
    ch.push(t[i]);bd.push(b);i++;
  }
  const p=ch.join(""), mk=new Array(p.length).fill(false);
  if(hl&&CKRE){ CKRE.lastIndex=0; let m;
    while((m=CKRE.exec(p))!==null){
      for(let k=m.index;k<m.index+m[0].length;k++)mk[k]=true;
      if(m.index===CKRE.lastIndex)CKRE.lastIndex++;
    } }
  let out="",cb=null,cm=null,buf="";
  const flush=()=>{ if(!buf)return;
    let x=esc(buf);
    if(cb)x='<b class="kk">'+x+'</b>';
    if(cm)x='<mark class="hl">'+x+'</mark>';
    out+=x;buf=""; };
  for(let k=0;k<p.length;k++){
    if(bd[k]!==cb||mk[k]!==cm){flush();cb=bd[k];cm=mk[k];}
    buf+=p[k];
  }
  flush(); return out;
}
const HLROW={"學說對決":1,"學說與實務對決":1,"兩邊在吵什麼":1,"本文見解（理由）":1,"考場挺哪說（理由）":1,"本文見解":1,"考場挺哪說":1};
function cmpCell(items,hl){
  return (items||[]).map(x=>{
    if(x.h)return '<div class="ch2">'+esc(x.h)+'</div>';
    const d=" d"+(x.d||0);
    return x.s ? '<div class="ci'+d+'"><b class="cs">'+esc(x.s)+'</b>'+mkHL(x.t,hl)+'</div>'
               : '<div class="cp'+d+'">'+mkHL(x.t,hl)+'</div>';
  }).join("");
}
function cmpHTML(t){
  const d=CMPD()[t.code];
  if(!d)return '<div class="empty" style="padding:22px 0">此爭點尚無左右對照版</div>';
  setCmpKeys(t.code);
  let h='<div class="cmp"><div class="cmpt">'+esc(d.t)+'</div>'+
        '<div class="crow chd"><div class="cc l"><span>⚖️ 學理原文・申論輸出</span></div>'+
        '<div class="cc r"><span>💬 白話速記・考場反射</span></div></div>';
  (d.rows||[]).forEach(r=>{
    const hl=!!(HLROW[r.ll]||HLROW[r.rl]);
    h+='<div class="crow'+(hl?" hlrow":"")+'"><div class="cc l"><div class="clab">'+esc(r.ll)+'</div>'+cmpCell(r.l,hl)+'</div>'+
       '<div class="cc r"><div class="clab">'+esc(r.rl)+'</div>'+cmpCell(r.r,hl)+'</div></div>';
  });
  return h+'</div>';
}
function bodyHTML(t,mode){
  if(sj==="te")return teHTML(t,mode);
  if(mode==="cmp")return cmpHTML(t);
  setKeys(t.code);
  let h="",a=0,b=0;
  if(mode==="sd"){
    const d=SUDUD()[t.code];
    if(!d)return '<div class="empty" style="padding:22px 0">此題速讀版尚未製作</div>';
    h='<div class="sd">';
    d.forEach(([k,v])=>{h+='<div class="r k'+k+'"><span class="lb L'+k+'">'+k+'</span><span class="bd">'+plain(v)+'</span></div>';});
    return h+'</div>';
  }
  t.items.forEach(it=>{
    if(it.k==="lead")h+='<div class="lead">'+rich(it.t)+'</div>';
    else if(it.k==="h1"){a++;b=0;h+='<div class="h1x">'+CN[a-1]+'、'+plain(it.t)+'</div>';}
    else if(it.k==="h2"){b++;h+='<div class="h2x">（'+CN[b-1]+'）'+plain(it.t)+'</div>';}
    else if(it.k==="p")h+='<div class="p'+(b?' d2':'')+'">'+rich(it.t)+'</div>';
    else if(it.k==="tip")h+='<div class="tip">【考場提示】'+esc(it.t)+'</div>';
  });
  return h;
}
function secNoteHTML(ch,sec){
  const code="§"+ch+"｜"+sec;
  const open=localStorage.getItem("nidaopen_"+px()+code)==="1";
  return '<div class="note secnote'+(open?"":" clip")+'" data-code="'+esc(code)+'">'+
    '<div class="hd"><span data-lb="📔 '+esc(sec||ch)+'　章節筆記（自動儲存）">📔 '+esc(sec||ch)+'　章節筆記（自動儲存）</span>'+
    '<span><button class="tg2" data-code="'+esc(code)+'">'+(open?"▴ 收合":"▾ 展開全部")+'</button> '+
    '<button class="tg2 pic" data-code="'+esc(code)+'">📷 插入照片</button></span></div>'+
    '<div class="nb" contenteditable="true" data-code="'+esc(code)+'" '+
    'data-ph="這一節的整體心得、老師補充、考古題整理、拍下的板書…"></div></div>';
}
const K=(c,m)=>"nida_"+px()+c+"_"+m, KN=c=>"nidanote_"+px()+c;
const SK=c=>"nidastar_"+px()+c;
const SR=c=>localStorage.getItem(SK(c))==="1";
const starOnly=()=>localStorage.getItem("nida_staronly")==="1";
const nStar=()=>DATA().filter(t=>SR(t.code)).length;
const IDB=(()=>{let db=null;
  function open(){return new Promise((res,rej)=>{ if(db)return res(db);
    const r=indexedDB.open("nidaNotes",1);
    r.onupgradeneeded=()=>{try{r.result.createObjectStore("notes")}catch(e){}};
    r.onsuccess=()=>{db=r.result;res(db)}; r.onerror=()=>rej(r.error);});}
  async function get(k){try{const d=await open();return await new Promise(r=>{
    const q=d.transaction("notes").objectStore("notes").get(k);
    q.onsuccess=()=>r(q.result||""); q.onerror=()=>r("");});}catch(e){return localStorage.getItem(KN(k))||"";}}
  async function set(k,v){try{const d=await open();return await new Promise(r=>{
    const q=d.transaction("notes","readwrite").objectStore("notes").put(v,k);
    q.onsuccess=()=>r(1); q.onerror=()=>r(0);});}catch(e){try{localStorage.setItem(KN(k),v)}catch(_){ }}}
  return {get,set};})();
async function loadNotes(){
  for(const box of document.querySelectorAll(".note")){
    const c=box.dataset.code, nb=box.querySelector(".nb"); if(!nb)continue;
    let v=await IDB.get(px()+c);
    if(!v){ const old=localStorage.getItem(KN(c));
      if(old){ v=esc(old).replace(/\n/g,"<br>"); await IDB.set(px()+c,v); } }
    nb.innerHTML=v||""; updHd(box); fit(nb);
  }
}
function updHd(box){
  const nb=box.querySelector(".nb"); if(!nb)return;
  const n=nb.innerText.trim().length, im=nb.querySelectorAll("img").length;
  const c=box.querySelector(".hd span[data-lb]");
  if(c)c.innerHTML=esc(c.dataset.lb)+((n||im)?'　<span style="opacity:.7">'+(n?n+' 字':'')+(im?(n?'・':'')+im+' 張圖':'')+'</span>':'');
}
function render(){
  const app=document.getElementById("app");let html="",lastCh="",lastSec="",n=0;
  DATA().forEach((t,idx)=>{
    const blob=(t.code+t.title+t.items.map(i=>(i.t||"")+(i.zh||"")+((i.v||[]).map(x=>(x.w||"")+(x.zh||"")+(x.v||"")).join(""))).join("")).toLowerCase();
    if(kw&&!blob.includes(kw))return;
    if(starOnly()&&!SR(t.code))return;
    n++;
    if(t.sec!==lastSec&&lastSec){html+=secNoteHTML(lastCh,lastSec);}
    if(t.ch!==lastCh){html+='<div class="ch">'+esc(t.ch)+'</div>';lastCh=t.ch;lastSec="";}
    if(t.sec!==lastSec){html+='<div class="sec">'+esc(t.sec)+'</div>';lastSec=t.sec;}
    setKeys(t.code);
    const mode=localStorage.getItem("nidamode_"+px()+t.code)||"full";
    const saved=localStorage.getItem(K(t.code,mode));
    const note=localStorage.getItem(KN(t.code))||"";
    html+='<div class="tp" id="t'+idx+'" data-i="'+idx+'" data-code="'+t.code+'" data-mode="'+mode+'">'+
      '<div class="tt"><span>'+CUR().label+' '+esc(t.code)+'　'+esc(t.title)+
      (saved?'<span class="edited">已編輯</span>':'')+'</span><span class="btns">'+
      (CMPD()[t.code]?'<button class="tb cmb'+(mode==="cmp"?" on":"")+'" data-i="'+idx+'" title="左右對照（學理／白話）">⚖ 對照</button>':'')+
      '<button class="tb star'+(SR(t.code)?" on":"")+'" data-i="'+idx+'" title="標為重要">'+(SR(t.code)?"★":"☆")+'</button>'+
      (sj==="te"?'<button class="tb vbb'+(localStorage.getItem("nidavoc_"+t.code)==="1"?" on":"")+'" data-i="'+idx+'" title="核心字彙總覽">📝 字彙</button>':'')+
      (sj==="te"?'<button class="tb xpb'+(localStorage.getItem("nidax_"+t.code)==="1"?" on":"")+'" data-i="'+idx+'">🔍 全面解析</button>':'')+
      '<button class="tb sw'+(mode==="sd"?" on":"")+'" data-i="'+idx+'">'+(mode==="sd"?(sj==="te"?"📄 原文":"📄 擬答"):(sj==="te"?"🌲 速讀":"⚡ 速讀"))+'</button>'+
      '<button class="tb ed" data-i="'+idx+'">✏️</button>'+
      '<button class="tb play" data-i="'+idx+'">🔊</button></span></div>'+
      '<div class="body">'+(saved||bodyHTML(t,mode))+'</div>'+
      (sj==="te"?vocPanel(t):"")+
      '<div class="note'+(note.length>120&&localStorage.getItem("nidaopen_"+px()+t.code)!=="1"?" clip":"")+'" data-code="'+esc(t.code)+'">'+
      '<div class="hd"><span data-lb="📝 我的筆記（自動儲存）">📝 我的筆記（自動儲存）'+(note?'　<span style="opacity:.7">'+note.length+' 字</span>':'')+'</span>'+
      '<span><button class="tg2" data-code="'+esc(t.code)+'">'+(localStorage.getItem("nidaopen_"+px()+t.code)==="1"?"▴ 收合":"▾ 展開全部")+'</button> '+
      '<button class="tg2 pic" data-code="'+esc(t.code)+'">📷 插入照片</button></span></div>'+
      '<div class="nb" contenteditable="true" data-code="'+esc(t.code)+'" data-ph="貼上文字或照片（⌘V）、也可把圖片拖進來…"></div></div>'+
      '</div>';
  });
  if(lastSec)html+=secNoteHTML(lastCh,lastSec);
  app.innerHTML=html||'<div class="empty">找不到符合的題型</div>';
  document.getElementById("cnt").textContent="顯示 "+n+" 題";
  setTimeout(()=>{loadNotes();},0);
}
function buildTOC(){
  let h="",lc="",ls="";
  DATA().forEach((t,i)=>{
    if(starOnly()&&!SR(t.code))return;
    if(t.ch!==lc){h+='<div class="tch">'+esc(t.ch)+'</div>';lc=t.ch;ls="";}
    if(t.sec!==ls){h+='<div class="tsec">'+esc(t.sec)+'</div>';ls=t.sec;}
    h+='<a href="#t'+i+'" data-i="'+i+'"><span class="code">'+esc(t.code)+'</span>'+esc(t.title)+
      (SR(t.code)?'<span class="stm">★</span>':'')+'</a>';
  });
  const n=document.getElementById("toc");n.innerHTML=h;
  n.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;
    e.preventDefault();const el=document.getElementById("t"+a.dataset.i);
    if(el)el.scrollIntoView({block:"start",behavior:"smooth"});
    n.classList.remove("open");});
}
function syncTOC(){
  const tops=[...document.querySelectorAll(".tp")].map(e=>({i:e.dataset.i,y:e.getBoundingClientRect().top}));
  const act=tops.filter(t=>t.y<160).pop()||tops[0];
  document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("on",act&&a.dataset.i===act.i));
}
document.getElementById("tocbtn").onclick=()=>document.getElementById("toc").classList.toggle("open");
addEventListener("scroll",()=>{clearTimeout(window.__st);window.__st=setTimeout(syncTOC,80)},{passive:true});
document.getElementById("q").oninput=e=>{kw=e.target.value.trim().toLowerCase();render();allMode();syncTOC();reapplyNow()};

(function(){const b=document.getElementById("kk");

function shrink(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image();
    im.onload=()=>{ const max=1400, k=Math.min(1,max/im.width);
      const cv=document.createElement("canvas");
      cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      let url; try{url=cv.toDataURL("image/jpeg",0.72);}catch(e){url=fr.result;}
      cb(url); };
    im.onerror=()=>cb(fr.result); im.src=fr.result; };
  fr.readAsDataURL(file);
}

    catch(e){ const i=document.createElement("img"); i.src=url; nb.appendChild(i); }
    saveNote(box);
  }));
}
app.addEventListener("input",e=>{ const nb=e.target.closest(".nb"); if(nb)saveNote(nb.closest(".note")); });
app.addEventListener("paste",e=>{
  const nb=e.target.closest(".nb"); if(!nb)return;
  const items=[...(e.clipboardData||{}).items||[]];
  const imgs=items.filter(i=>i.kind==="file"&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);
  if(imgs.length){ e.preventDefault(); insertImgs(imgs,nb.closest(".note")); return; }
  e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText",false,txt); saveNote(nb.closest(".note"));
});
app.addEventListener("dragover",e=>{ if(e.target.closest(".nb"))e.preventDefault(); });
app.addEventListener("drop",e=>{
  const nb=e.target.closest(".nb"); if(!nb)return; e.preventDefault();
  insertImgs(e.dataTransfer.files,nb.closest(".note"));
});
app.addEventListener("focusin",e=>{const nb=e.target.closest(".nb");
  if(nb){const b=nb.closest(".note"); b.classList.remove("clip");
    localStorage.setItem("nidaopen_"+px()+nb.dataset.code,"1");
    const btn=b.querySelector(".tg2"); if(btn)btn.textContent="▴ 收合"; fit(nb);}});
app.addEventListener("click",e=>{
  const im=e.target.closest(".nb img");
  if(im){ const lb=document.getElementById("lbx"); if(lb){lb.querySelector("img").src=im.src; lb.style.display="flex";} return; }
  const pic=e.target.closest(".tg2.pic");
  if(pic){ const box=pic.closest(".note"); const inp=document.getElementById("pick"); if(!inp)return;
    inp.onchange=()=>{ insertImgs(inp.files,box); inp.value=""; }; inp.click(); return; }
});
const _lb=document.getElementById("lbx"); if(_lb)_lb.onclick=function(){this.style.display="none";};
app.addEventListener("click",e=>{
  const t2=e.target.closest(".tg2"); if(!t2||t2.classList.contains("pic"))return;
  const box=t2.closest(".note"), nb=box.querySelector(".nb");
  const open=box.classList.toggle("clip")===false;
  localStorage.setItem("nidaopen_"+px()+t2.dataset.code,open?"1":"0");
  t2.textContent=open?"▴ 收合":"▾ 展開全部";
  if(open)fit(nb); else nb.style.height="";});
function toggleEdit(card){
  const body=card.querySelector(".body"), on=body.getAttribute("contenteditable")==="true";
  const c=card.dataset.code, m=card.dataset.mode;
  if(on){
    body.setAttribute("contenteditable","false");
    localStorage.setItem(K(c,m),body.innerHTML);
    card.querySelector(".tools")?.remove();
    card.querySelector(".ed").classList.remove("on");
    if(!card.querySelector(".edited")){
      const s2=document.createElement("span");s2.className="edited";s2.textContent="已編輯";
      card.querySelector(".tt span").appendChild(s2);}
    return;
  }
  body.setAttribute("contenteditable","true");
  card.querySelector(".ed").classList.add("on");
  const tb=document.createElement("div");tb.className="tools";
  tb.innerHTML='<button data-a="red">🔴 紅字</button><button data-a="hl">🖍️ 螢光筆</button>'+
    '<button data-a="blue">🔵 藍字</button><button data-a="b">B 粗體</button>'+
    '<button data-a="clr">↩️ 清除格式</button><button data-a="save">💾 存檔</button>'+
    '<button data-a="reset">♻️ 還原原文</button>';
  body.parentNode.insertBefore(tb,body);
  tb.onclick=ev=>{
    const a=ev.target.closest("button")?.dataset.a; if(!a)return;
    body.focus();
    try{
      if(a==="red")document.execCommand("foreColor",false,"#c0392b");
      else if(a==="blue")document.execCommand("foreColor",false,"#1b4f72");
      else if(a==="hl")document.execCommand("hiliteColor",false,"#ffe680");
      else if(a==="b")document.execCommand("bold",false,null);
      else if(a==="clr")document.execCommand("removeFormat",false,null);
      else if(a==="save"){localStorage.setItem(K(c,m),body.innerHTML);ev.target.textContent="✓ 已存";
        setTimeout(()=>ev.target.textContent="💾 存檔",1200);}
      else if(a==="reset"){if(confirm("還原成原文？你的顏色與標記會消失（筆記欄不受影響）")){
        localStorage.removeItem(K(c,m));render();syncTOC();}}
    }catch(err){}
  };
}
document.getElementById("pp").onclick=()=>{
  if(playing){if(speechSynthesis.paused){speechSynthesis.resume();document.getElementById("pp").textContent="⏸ 暫停";}
    else{speechSynthesis.pause();document.getElementById("pp").textContent="▶ 繼續";}return;}
  start(visibleIdx());};

(function(){const sel=document.getElementById("imgsz");if(!sel)return;
  const v=localStorage.getItem("mb_imgw")||"320"; sel.value=v;
  const app2=w=>{const px=(w==="9999"?"100%":w+"px");
    document.documentElement.style.setProperty("--imgw",px);
    document.documentElement.style.setProperty("--imgh",(w==="9999"?"none":Math.round(+w*0.82)+"px"));
    localStorage.setItem("mb_imgw",w); if(window.fitAll)setTimeout(window.fitAll,60);};
  app2(v); sel.onchange=e=>app2(e.target.value);})();
/* ── 字級（記憶） ── */
(function(){
  let sc=parseFloat(localStorage.getItem("mb_scale")||"1");
  const v=document.getElementById("fsv");
  const app=()=>{document.documentElement.style.setProperty("--sc",sc);
    if(v)v.textContent=Math.round(sc*100)+"%";localStorage.setItem("mb_scale",sc);
    if(window.fitAll)setTimeout(window.fitAll,30);};
  document.getElementById("fsp").onclick=()=>{sc=Math.min(2,+(sc+0.1).toFixed(2));app();};
  document.getElementById("fsm").onclick=()=>{sc=Math.max(0.8,+(sc-0.1).toFixed(2));app();};
  app();
})();
