<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>✍️ 行政法題型擬答 ‧ 司法官律師平台</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2833;--sub:#5d6d7e;--line:#e5e8e8;--acc:#1b4f72;--red:#7b241c;--gold:#7d6608}
@media(prefers-color-scheme:dark){:root{--bg:#151a1f;--card:#1d242b;--ink:#e8eef3;--sub:#9fb0bf;--line:#2c353d;--acc:#5dade2;--red:#e59a92;--gold:#d4ac0d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.85 -apple-system,"PingFang TC","Noto Sans TC",serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0 0 8px;font-size:17px}
h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}
#q{flex:1;min-width:160px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#jump{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);max-width:60%}
.wrap{display:flex;gap:0;align-items:flex-start;max-width:1680px;margin:0 auto}
#toc{position:sticky;top:96px;flex:0 0 268px;max-height:calc(100vh - 130px);overflow:auto;
padding:10px 8px 20px 14px;border-right:1px solid var(--line);font-size:13px}
#toc .tch{font-weight:700;color:#fff;background:var(--acc);padding:5px 9px;border-radius:5px;margin:12px 0 6px;font-size:12.6px}
#toc .tsec{font-weight:700;color:var(--acc);margin:9px 0 3px;font-size:12.6px}
#toc a{display:block;padding:4px 7px 4px 12px;color:var(--sub);text-decoration:none;border-left:2px solid transparent;border-radius:0 5px 5px 0;line-height:1.5}
#toc a:hover{background:rgba(93,173,226,.13);color:var(--ink)}
#toc a.on{border-left-color:var(--red);color:var(--red);font-weight:700;background:rgba(123,36,28,.08)}
#toc .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;opacity:.75;margin-right:4px}
main{flex:1;min-width:0;padding:12px 34px 92px 22px}
#tocbtn{display:none}
@media(max-width:880px){
 #toc{position:fixed;left:0;top:0;bottom:0;z-index:40;width:80%;max-width:310px;max-height:none;
 background:var(--card);box-shadow:0 0 30px rgba(0,0,0,.35);transform:translateX(-102%);transition:.25s;padding-top:16px}
 #toc.open{transform:none}
 #tocbtn{display:inline-block;padding:6px 11px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}
 main{padding-bottom:96px}
}
.ch{margin:26px 0 8px;font-weight:700;color:#fff;background:var(--acc);padding:8px 13px;border-radius:7px;font-size:15px}
.sec{margin:16px 0 6px;font-weight:700;color:var(--acc);background:rgba(93,173,226,.13);padding:6px 12px;border-radius:6px;font-size:14px}
.tp{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:9px;padding:12px 15px;margin:12px 0}
.tt{font-weight:700;font-size:15.5px;color:var(--red);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.lead{text-indent:2em;margin:8px 0 12px;font-size:14.6px}
.h1x{font-weight:700;color:var(--acc);margin:14px 0 6px;font-size:14.8px}
.h2x{font-weight:700;margin:10px 0 4px 1.4em;font-size:14.4px}
.p{text-indent:2em;margin:6px 0 6px 1.4em;font-size:14.4px}
.p.d2{margin-left:2.8em}
.tip{background:rgba(212,172,13,.12);border-left:3px solid var(--gold);padding:8px 12px;margin:12px 0 2px;font-size:13.3px;color:var(--gold);border-radius:0 6px 6px 0}
b.kk{color:#c0392b;font-weight:700}
body.nokk b.kk{color:inherit;font-weight:inherit}
@media(prefers-color-scheme:dark){b.kk{color:#ec7063}}
.play{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px;color:var(--sub);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:30;flex-wrap:wrap}
.bar b{font-size:12.5px;color:var(--sub);font-weight:500}
.bar button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
.bar button.p2{background:var(--acc);color:#fff;border-color:var(--acc)}
.mini{font-size:12px;color:var(--sub)}
.now{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.btns{display:flex;gap:5px;align-items:center;white-space:nowrap}
#allsd{padding:5px 11px;font-size:12.5px}
.tb{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;color:var(--sub)}
.tb.on{background:var(--red);color:#fff;border-color:var(--red)}
.sd{margin-top:6px}
.sd .r{display:flex;gap:7px;margin:5px 0;align-items:flex-start}
.sd .lb{flex:0 0 auto;width:23px;height:20px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sd .bd{flex:1;font-size:14.3px;line-height:1.75}
.L爭{background:#8e6c1a}.L據{background:#566573}.L實{background:#2b5f8f}.L說{background:#2e7d52}
.L採{background:#7d3c98}.L攝{background:#117864}.L結{background:#b03a2e}.L訣{background:#7d6608}
.sd .r.k訣 .bd{background:rgba(212,172,13,.13);padding:6px 10px;border-radius:6px;font-size:13.2px}
.tools{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px;padding:6px 8px;background:rgba(93,173,226,.09);border-radius:7px}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12.5px}
.body[contenteditable="true"]{outline:2px dashed var(--acc);outline-offset:6px;border-radius:6px;background:rgba(93,173,226,.04)}
.note{margin-top:10px}
.note textarea{width:100%;min-height:62px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
background:var(--bg);color:var(--ink);font:inherit;font-size:13.6px;line-height:1.7;resize:vertical}
.note .hd{font-size:12px;color:var(--sub);margin-bottom:3px}
.edited{font-size:11px;color:var(--gold);margin-left:6px}
</style></head><body>
<header>
<h1>✍️ 行政法題型擬答<small>上榜答題體例　按…次按…查本案中…綜上所述　共 <span id="tot">—</span> 題</small></h1>
<div class="row">
<button id="tocbtn">☰ 目錄</button>
<button id="allsd" class="tb">⚡ 全部速讀</button>
<button id="kk" class="tb">🔴 重點紅字</button>
<input id="q" placeholder="搜尋題型、條號、關鍵字…">
<span class="mini" id="cnt"></span>
</div>
</header>
<div class="wrap"><nav id="toc"></nav><main id="app"></main></div>
<div class="bar">
<button id="pp" class="p2">▶ 朗讀全部</button>
<button id="stop">■ 停</button>
<b>語速</b><span class="mini" id="ratev" style="min-width:38px;display:inline-block"></span><input id="rate" type="range" min="0.8" max="2" step="0.05" value="1.3" style="width:88px">
<b>聲音</b><select id="voice" style="max-width:148px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg)"></select>
<b>朗讀</b><select id="rmode" style="padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg)">
<option value="screen">跟著畫面</option><option value="sd">一律速讀</option><option value="full">一律擬答</option></select>
<label class="mini"><input type="checkbox" id="contall" checked> 點一題從該題念到底</label>
<label class="mini"><input type="checkbox" id="notip"> 不念考場提示</label>
<span class="mini" id="nowt"></span><span class="mini" id="st"></span>
</div>
<script src="nida-data.js"></script>
<script src="sudu-data.js"></script>
<script src="key-data.js"></script>
<script>
const CN="一二三四五六七八九十";
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
let KEYRE=null;
function setKeys(code){
  const ks=((window.KEYS||{})[code]||[]).slice().sort((a,b)=>b.length-a.length);
  KEYRE = ks.length ? new RegExp("("+ks.map(esc).map(reEsc).join("|")+")","g") : null;
}
/* 擬答版：標紅（＝該題速讀版的內容）；速讀版與標題：不標 */
function rich(s){ const h=esc(s); return KEYRE? h.replace(KEYRE,'<b class="kk">$1</b>') : h; }
function plain(s){ return esc(s); }
let kw="";
function bodyHTML(t,mode){
  setKeys(t.code);
  let h="",a=0,b=0;
  if(mode==="sd"){
    const d=(window.SUDU||{})[t.code];
    if(!d)return '<div class="empty" style="padding:22px 0">此題速讀版尚未製作</div>';
    h='<div class="sd">';
    d.forEach(([k,v])=>{h+='<div class="r k'+k+'"><span class="lb L'+k+'">'+k+'</span><span class="bd">'+plain(v)+'</span></div>';});
    return h+'</div>';
  }
  t.items.forEach(it=>{
    if(it.k==="lead")h+='<div class="lead">'+rich(it.t)+'</div>';
    else if(it.k==="h1"){a++;b=0;h+='<div class="h1x">'+CN[a-1]+'、'+plain(it.t)+'</div>';}
    else if(it.k==="h2"){b++;h+='<div class="h2x">（'+CN[b-1]+'）'+plain(it.t)+'</div>';}
    else if(it.k==="p")h+='<div class="p'+(b?' d2':'')+'">'+rich(it.t)+'</div>';
    else if(it.k==="tip")h+='<div class="tip">【考場提示】'+esc(it.t)+'</div>';
  });
  return h;
}
const K=(c,m)=>"nida_"+c+"_"+m, KN=c=>"nidanote_"+c;
function render(){
  const app=document.getElementById("app");let html="",lastCh="",lastSec="",n=0;
  window.NIDA.forEach((t,idx)=>{
    const blob=(t.code+t.title+t.items.map(i=>i.t).join("")).toLowerCase();
    if(kw&&!blob.includes(kw))return;
    n++;
    if(t.ch!==lastCh){html+='<div class="ch">'+esc(t.ch)+'</div>';lastCh=t.ch;lastSec="";}
    if(t.sec!==lastSec){html+='<div class="sec">'+esc(t.sec)+'</div>';lastSec=t.sec;}
    setKeys(t.code);
    const mode=localStorage.getItem("nidamode_"+t.code)||"full";
    const saved=localStorage.getItem(K(t.code,mode));
    const note=localStorage.getItem(KN(t.code))||"";
    html+='<div class="tp" id="t'+idx+'" data-i="'+idx+'" data-code="'+t.code+'" data-mode="'+mode+'">'+
      '<div class="tt"><span>題型 '+esc(t.code)+'　'+esc(t.title)+
      (saved?'<span class="edited">已編輯</span>':'')+'</span><span class="btns">'+
      '<button class="tb sw'+(mode==="sd"?" on":"")+'" data-i="'+idx+'">'+(mode==="sd"?"📄 擬答":"⚡ 速讀")+'</button>'+
      '<button class="tb ed" data-i="'+idx+'">✏️</button>'+
      '<button class="tb play" data-i="'+idx+'">🔊</button></span></div>'+
      '<div class="body">'+(saved||bodyHTML(t,mode))+'</div>'+
      '<div class="note"><div class="hd">📝 我的筆記（自動儲存）</div>'+
      '<textarea data-code="'+esc(t.code)+'" placeholder="貼上或寫下你自己的補充…">'+esc(note)+'</textarea></div>'+
      '</div>';
  });
  app.innerHTML=html||'<div class="empty">找不到符合的題型</div>';
  document.getElementById("cnt").textContent="顯示 "+n+" 題";
}
function buildTOC(){
  let h="",lc="",ls="";
  window.NIDA.forEach((t,i)=>{
    if(t.ch!==lc){h+='<div class="tch">'+esc(t.ch)+'</div>';lc=t.ch;ls="";}
    if(t.sec!==ls){h+='<div class="tsec">'+esc(t.sec)+'</div>';ls=t.sec;}
    h+='<a href="#t'+i+'" data-i="'+i+'"><span class="code">'+esc(t.code)+'</span>'+esc(t.title)+'</a>';
  });
  const n=document.getElementById("toc");n.innerHTML=h;
  n.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;
    e.preventDefault();const el=document.getElementById("t"+a.dataset.i);
    if(el)el.scrollIntoView({block:"start",behavior:"smooth"});
    n.classList.remove("open");});
}
function syncTOC(){
  const tops=[...document.querySelectorAll(".tp")].map(e=>({i:e.dataset.i,y:e.getBoundingClientRect().top}));
  const act=tops.filter(t=>t.y<160).pop()||tops[0];
  document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("on",act&&a.dataset.i===act.i));
}
document.getElementById("tocbtn").onclick=()=>document.getElementById("toc").classList.toggle("open");
addEventListener("scroll",()=>{clearTimeout(window.__st);window.__st=setTimeout(syncTOC,80)},{passive:true});
document.getElementById("q").oninput=e=>{kw=e.target.value.trim().toLowerCase();render();allMode();syncTOC();reapplyNow()};
function allMode(){const v=window.NIDA.every(t=>(localStorage.getItem("nidamode_"+t.code)||"full")==="sd");
  const b=document.getElementById("allsd"); b.classList.toggle("on",v);
  b.textContent=v?"📄 全部擬答":"⚡ 全部速讀"; return v;}
(function(){const b=document.getElementById("kk");
  const off=localStorage.getItem("nida_nokk")==="1";
  document.body.classList.toggle("nokk",off); b.classList.toggle("on",!off);
  b.onclick=()=>{const n=!document.body.classList.contains("nokk");
    document.body.classList.toggle("nokk",n);
    localStorage.setItem("nida_nokk",n?"1":"0"); b.classList.toggle("on",!n);};})();
document.getElementById("allsd").onclick=()=>{
  const toFull=allMode();
  window.NIDA.forEach(t=>localStorage.setItem("nidamode_"+t.code,toFull?"full":"sd"));
  render();allMode();syncTOC();
  if(playing&&readMode()==="screen"){
    const from=queue[qi]?queue[qi].i:null, vis=visibleIdx(), pos=vis.indexOf(from);
    stopAll(); start(pos>=0?vis.slice(pos):vis);
  }else reapplyNow();};
const PLAYLABEL="▶ 朗讀全部";

/* ── 朗讀引擎（防 GC／防 15 秒斷線／watchdog 續播） ── */
let voices=[],pref=localStorage.getItem("mb_voice")||"",queue=[],qi=0,playing=false,keep=null,wd=null;
let utterRefs=[];               // 保留參考，避免被 GC 掉導致 onend 不觸發
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}
  const zh=voices.filter(v=>/^zh|^cmn|^yue/i.test(v.lang));const s=document.getElementById("voice");
  if(!s)return; s.innerHTML="";
  zh.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name;s.appendChild(o)});
  const mj=zh.find(v=>/Meijia|美佳/i.test(v.name));if(!pref&&mj)pref=mj.name;if(pref)s.value=pref;}
function best(){const zh=voices.filter(v=>/^zh|^cmn|^yue/i.test(v.lang));
  return zh.find(v=>v.name===pref)||zh.find(v=>/Meijia|美佳/i.test(v.name))||zh.find(v=>v.lang==="zh-TW")||zh[0]||null;}
function rateNow(){return parseFloat(document.getElementById("rate").value)||1.3;}
(function(){const r=document.getElementById("rate");if(!r)return;
  const sv=localStorage.getItem("mb_rate"); if(sv)r.value=sv;
  const lab=document.getElementById("ratev"); const show=()=>{if(lab)lab.textContent=(+r.value).toFixed(2)+"×";};
  show(); r.oninput=()=>{localStorage.setItem("mb_rate",r.value);show();};})();
function chunks(t){const out=[];let s="";
  String(t).replace(/\s+/g," ").split(/(?<=[。！？；：，])/).forEach(p=>{
    if((s+p).length>90){if(s)out.push(s);s=p}else s+=p});
  if(s.trim())out.push(s);return out.filter(x=>x.trim());}
function speakNext(){
  clearTimeout(wd);
  if(!playing){return;}
  if(qi>=queue.length){stopAll();return;}
  const it=queue[qi];
  if(!it.silent)highlight(it);
  const u=new SpeechSynthesisUtterance(it.text);
  u.lang="zh-TW"; u.rate=it.silent?2:rateNow(); if(it.silent)u.volume=0;
  const v=best(); if(v)u.voice=v;
  utterRefs.push(u); if(utterRefs.length>40)utterRefs.shift();
  let done=false;
  const go=()=>{ if(done)return; done=true; clearTimeout(wd); qi++; setTimeout(speakNext,20); };
  u.onend=go; u.onerror=go;
  const st=document.getElementById("st"); if(st)st.textContent=Math.max(1,qi)+" / "+(queue.length-1);
  try{ speechSynthesis.speak(u); }catch(e){ go(); return; }
  // watchdog：依字數估時長，逾時仍未結束就強制前進，避免整串卡死
  const est=Math.max(4000, it.text.length*(1000/(4.2*rateNow()))+4000);
  wd=setTimeout(()=>{ if(playing&&!done){ try{speechSynthesis.cancel()}catch(e){} go(); } },est);
}
function whenIdle(cb,n){n=n||0;
  try{ if(!speechSynthesis.speaking&&!speechSynthesis.pending)return cb(); }catch(e){ return cb(); }
  if(n>40)return cb();
  setTimeout(()=>whenIdle(cb,n+1),50);}
function start(list){
  try{speechSynthesis.cancel()}catch(e){}
  queue=[];qi=0;utterRefs=[];
  buildQueue(list);
  if(!queue.length)return;
  queue.unshift({text:"　",i:queue[0].i,first:false,silent:true});   // 靜音前導，吸收被吞的第一段
  playing=true;
  const pp=document.getElementById("pp"); if(pp)pp.textContent="⏸ 暫停";
  clearInterval(keep);
  keep=setInterval(()=>{ if(!playing)return;
    if(speechSynthesis.speaking&&!speechSynthesis.paused){ try{speechSynthesis.pause();speechSynthesis.resume();}catch(e){} }
  },9000);
  whenIdle(()=>setTimeout(speakNext,120));
}
function stopAll(){playing=false;clearInterval(keep);clearTimeout(wd);
  try{speechSynthesis.cancel()}catch(e){}
  const pp=document.getElementById("pp"); if(pp)pp.textContent=PLAYLABEL;
  const st=document.getElementById("st"); if(st)st.textContent="";
  document.querySelectorAll(".now").forEach(e=>e.classList.remove("now"));}

function highlight(it){
  document.querySelectorAll(".now").forEach(e=>e.classList.remove("now"));
  const el=document.getElementById("t"+it.i);
  if(el){el.classList.add("now"); if(it.first&&!window.__noscroll)el.scrollIntoView({block:"start",behavior:"smooth"});}
  const t=window.NIDA[it.i], nw=document.getElementById("nowt");
  if(nw&&t)nw.textContent="🔊 "+t.code+"　"+(modeOf(t.code)==="sd"?"速讀":"擬答");
}
function reapplyNow(){ if(playing&&queue[qi]){window.__noscroll=true;highlight(queue[qi]);window.__noscroll=false;} }
const LBN={"爭":"爭點","據":"依據","實":"實務見解","說":"學說","採":"本文見解","攝":"涵攝","結":"結論","訣":"口訣"};
function readMode(){return localStorage.getItem("nida_readmode")||"screen";}
function modeOf(code){
  let m=readMode();
  if(m==="screen")m=localStorage.getItem("nidamode_"+code)||"full";
  if(m==="sd"&&!(window.SUDU||{})[code])m="full";
  return m;
}
function stripHTML(html,no){
  const d=document.createElement("div"); d.innerHTML=html;
  if(no)d.querySelectorAll(".tip,.k訣").forEach(e=>e.remove());
  return d.innerText.replace(/\n{2,}/g,"\n").split("\n").map(x=>x.trim()).filter(Boolean)
          .map(x=>/[。！？；：]$/.test(x)?x:x+"。").join("");
}
function topicText(idx){
  const t=window.NIDA[idx], no=document.getElementById("notip").checked;
  const m=modeOf(t.code);
  let s="題型"+t.code.replace(/-/g,"之")+"。"+t.title+"。";
  const saved=localStorage.getItem("nida_"+t.code+"_"+m);
  if(saved)return s+stripHTML(saved,no);
  if(m==="sd"){
    ((window.SUDU||{})[t.code]||[]).forEach(([k,v])=>{ if(no&&k==="訣")return;
      s+=(LBN[k]||"")+"。"+v+(/[。！？]$/.test(v)?"":"。"); });
  }else{
    let a=0,b=0;
    t.items.forEach(it=>{
      if(it.k==="lead")s+=it.t;
      else if(it.k==="h1"){a++;b=0;s+=CN[a-1]+"、"+it.t+"。";}
      else if(it.k==="h2"){b++;s+="第"+CN[b-1]+"款。"+it.t+"。";}
      else if(it.k==="p")s+=it.t;
      else if(it.k==="tip"&&!no)s+="考場提示。"+it.t;
    });
  }
  return s;
}
function buildQueue(list){
  list.forEach(i=>chunks(topicText(i)).forEach((c,k)=>queue.push({text:c,i:i,first:k===0})));
}
function visibleIdx(){return [...document.querySelectorAll(".tp")].map(e=>+e.dataset.i);}
const app=document.getElementById("app");
app.addEventListener("click",e=>{
  const sw=e.target.closest(".sw");
  if(sw){const card=sw.closest(".tp"),c=card.dataset.code;
    const nm=card.dataset.mode==="sd"?"full":"sd";
    localStorage.setItem("nidamode_"+c,nm);render();allMode();syncTOC();
    const idx=+card.dataset.i, curIdx=(playing&&queue[qi])?queue[qi].i:null;
    if(playing&&readMode()==="screen"&&curIdx===idx){
      const vis=visibleIdx(),pos=vis.indexOf(idx);
      stopAll(); start(pos>=0&&document.getElementById("contall").checked?vis.slice(pos):[idx]);
    }else reapplyNow();
    const el=document.querySelector('[data-code="'+c+'"]'); if(el)el.scrollIntoView({block:"start"});
    return;}
  const ed=e.target.closest(".ed");
  if(ed){toggleEdit(ed.closest(".tp"));return;}
  const b=e.target.closest(".play");if(!b)return;
  const i=+b.dataset.i, vis=visibleIdx(), pos=vis.indexOf(i);
  const cont=document.getElementById("contall").checked;
  stopAll(); start(cont&&pos>=0?vis.slice(pos):[i]);});
app.addEventListener("input",e=>{
  const ta=e.target.closest(".note textarea"); if(!ta)return;
  localStorage.setItem(KN(ta.dataset.code),ta.value);});
function toggleEdit(card){
  const body=card.querySelector(".body"), on=body.getAttribute("contenteditable")==="true";
  const c=card.dataset.code, m=card.dataset.mode;
  if(on){
    body.setAttribute("contenteditable","false");
    localStorage.setItem(K(c,m),body.innerHTML);
    card.querySelector(".tools")?.remove();
    card.querySelector(".ed").classList.remove("on");
    if(!card.querySelector(".edited")){
      const s2=document.createElement("span");s2.className="edited";s2.textContent="已編輯";
      card.querySelector(".tt span").appendChild(s2);}
    return;
  }
  body.setAttribute("contenteditable","true");
  card.querySelector(".ed").classList.add("on");
  const tb=document.createElement("div");tb.className="tools";
  tb.innerHTML='<button data-a="red">🔴 紅字</button><button data-a="hl">🖍️ 螢光筆</button>'+
    '<button data-a="blue">🔵 藍字</button><button data-a="b">B 粗體</button>'+
    '<button data-a="clr">↩️ 清除格式</button><button data-a="save">💾 存檔</button>'+
    '<button data-a="reset">♻️ 還原原文</button>';
  body.parentNode.insertBefore(tb,body);
  tb.onclick=ev=>{
    const a=ev.target.closest("button")?.dataset.a; if(!a)return;
    body.focus();
    try{
      if(a==="red")document.execCommand("foreColor",false,"#c0392b");
      else if(a==="blue")document.execCommand("foreColor",false,"#1b4f72");
      else if(a==="hl")document.execCommand("hiliteColor",false,"#ffe680");
      else if(a==="b")document.execCommand("bold",false,null);
      else if(a==="clr")document.execCommand("removeFormat",false,null);
      else if(a==="save"){localStorage.setItem(K(c,m),body.innerHTML);ev.target.textContent="✓ 已存";
        setTimeout(()=>ev.target.textContent="💾 存檔",1200);}
      else if(a==="reset"){if(confirm("還原成原文？你的顏色與標記會消失（筆記欄不受影響）")){
        localStorage.removeItem(K(c,m));render();syncTOC();}}
    }catch(err){}
  };
}
document.getElementById("pp").onclick=()=>{
  if(playing){if(speechSynthesis.paused){speechSynthesis.resume();document.getElementById("pp").textContent="⏸ 暫停";}
    else{speechSynthesis.pause();document.getElementById("pp").textContent="▶ 繼續";}return;}
  start(visibleIdx());};
document.getElementById("stop").onclick=stopAll;
document.getElementById("voice").onchange=e=>{pref=e.target.value;localStorage.setItem("mb_voice",pref)};
const rm=document.getElementById("rmode"); rm.value=readMode();
rm.onchange=e=>{localStorage.setItem("nida_readmode",e.target.value);
  if(playing){const from=queue[qi]?queue[qi].i:null, vis=visibleIdx(), pos=vis.indexOf(from);
    stopAll(); start(pos>=0?vis.slice(pos):vis);}};
loadVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
document.getElementById("tot").textContent=window.NIDA.length;
buildTOC();render();allMode();syncTOC();
</script></body></html>
