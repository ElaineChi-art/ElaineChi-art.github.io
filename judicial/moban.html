<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📐 爭點答題模板 ‧ 司法官律師平台</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2833;--sub:#5d6d7e;--line:#e5e8e8;--acc:#1b4f72;
--q:#8e6c1a;--j:#566573;--s:#2b5f8f;--x:#2e7d52;--b:#7d3c98;--h:#117864;--c:#b03a2e}
@media(prefers-color-scheme:dark){:root{--bg:#151a1f;--card:#1d242b;--ink:#e8eef3;--sub:#9fb0bf;--line:#2c353d;--acc:#5dade2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0 0 8px;font-size:17px;letter-spacing:.5px}
h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}
.tab{padding:6px 14px;border:1px solid var(--line);background:transparent;border-radius:20px;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip{padding:4px 10px;border:1px solid var(--line);background:transparent;border-radius:14px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--ink);color:var(--bg)}
#q{flex:1;min-width:150px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.wrap{display:flex;align-items:flex-start;max-width:1680px;margin:0 auto}
#toc{position:sticky;top:104px;flex:0 0 250px;max-height:calc(100vh - 140px);overflow:auto;
padding:10px 8px 20px 14px;border-right:1px solid var(--line);font-size:calc(13px * var(--sc,1))}
#toc .subj{font-weight:700;color:#fff;background:var(--acc);padding:5px 9px;border-radius:5px;margin:6px 0 8px;font-size:12.6px}
#toc a{display:block;padding:4px 7px 4px 11px;color:var(--sub);text-decoration:none;border-left:2px solid transparent;border-radius:0 5px 5px 0;line-height:1.5}
#toc a:hover{background:rgba(93,173,226,.13);color:var(--ink)}
#toc a.on{border-left-color:var(--c);color:var(--c);font-weight:700;background:rgba(176,58,46,.08)}
#toc .num{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;opacity:.7;margin-right:5px}
#toc .qty{float:right;font-size:11px;opacity:.6}
main{flex:1;min-width:0;padding:12px 30px 90px 20px}
#tocbtn{display:none}
@media(max-width:880px){
 #toc{position:fixed;left:0;top:0;bottom:0;z-index:40;width:78%;max-width:300px;max-height:none;
 background:var(--card);box-shadow:0 0 30px rgba(0,0,0,.35);transform:translateX(-102%);transition:.25s;padding-top:16px}
 #toc.open{transform:none}
 #tocbtn{display:inline-block;padding:5px 10px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer;font-size:12.5px}
}
.band{margin:22px 0 10px;font-weight:700;font-size:calc(15px * var(--sc,1));color:#fff;background:var(--acc);padding:7px 12px;border-radius:7px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:9px;padding:11px 13px;margin:9px 0}
.ct{font-weight:700;font-size:calc(15px * var(--sc,1));display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.star{color:#c0392b;font-size:12px;white-space:nowrap}
.star.s2{color:#b7950b}.star.s1{color:#95a5a6}
.line{display:flex;gap:7px;margin-top:6px;align-items:flex-start}
.tg{flex:0 0 auto;width:22px;height:19px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;
display:flex;align-items:center;justify-content:center;margin-top:2px}
.tx{flex:1;font-size:calc(14.2px * var(--sc,1))}
.tx em{font-style:normal;font-weight:700;color:#8e1b1b}
@media(prefers-color-scheme:dark){.tx em{color:#f1948a}}
.b-b .tx,.b-c .tx{font-weight:600}
.play{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;color:var(--sub)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:30;flex-wrap:wrap}
.bar b{font-size:12.5px;color:var(--sub);font-weight:500}
.bar button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
.bar button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.mini{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.now{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<header>
<h1>📐 爭點答題模板<small>題→據→實→說→採→攝→結　共 <span id="tot">—</span> 個爭點</small></h1>
<div class="row" style="margin-bottom:6px">
<button class="tab on" data-s="xs">刑事訴訟法</button>
<button class="tab" data-s="xf">刑法</button>
<button class="tab" data-s="xz">行政法</button>
<input id="q" placeholder="搜尋爭點、條號、關鍵字…">
</div>
<div class="row">
<button id="tocbtn">☰ 目錄</button>
<button class="chip on" data-lv="0">全部</button>
<button class="chip" data-lv="3">★★★ 必考</button>
<button class="chip" data-lv="2">★★ 中頻</button>
<button class="chip" data-lv="1">★ 冷門</button>
<span class="mini" id="cnt"></span>
</div>
</header>
<div class="wrap"><nav id="toc"></nav><main id="app"></main></div>
<div class="bar">
<button id="pp" class="p">▶ 朗讀本頁</button>
<button id="stop">■ 停</button>
<b>字級</b><button id="fsm" style="padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer">A－</button><span class="mini" id="fsv" style="min-width:42px;display:inline-block;text-align:center"></span><button id="fsp" style="padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer">A＋</button>
<b>語速</b><span class="mini" id="ratev" style="min-width:38px;display:inline-block"></span><input id="rate" type="range" min="0.8" max="2" step="0.05" value="1.3" style="width:90px">
<b>聲音</b><select id="voice" style="max-width:150px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg)"></select>
<label class="mini"><input type="checkbox" id="contall" checked> 點一題從該題念到底</label>
<span class="mini" id="st"></span>
</div>
<script src="moban-data.js"></script>
<script>
const TAGS=[["q","題","--q"],["j","據","--j"],["s","實","--s"],["x","說","--x"],["b","採","--b"],["h","攝","--h"],["c","結","--c"]];
const LAB={q:"題目在問什麼",j:"條文依據",s:"實務見解",x:"學說",b:"本文採",h:"涵攝",c:"結論"};
let cur="xs",lv=0,kw="";
const EM=/(§\s*\d+[-\d]*[ⅠⅡⅢⅣⅤ]*|釋字第\s*[一二三四五六七八九十百○\d]+\s*號|憲判字第\s*\d+\s*號|第\s*[一二三四五六七八九十百千\d]+\s*條(?:第\s*[一二三四五六七八九十\d]+\s*項)?(?:第\s*[一二三四五六七八九十\d]+\s*款)?|最高行政法院[^，。；、）]{0,18}|大法庭[^，。；、）]{0,10})/g;
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const rich=s=>esc(s).replace(EM,'<em>$1</em>');
function render(){
  const D=window.MOBAN[cur],app=document.getElementById("app");
  let html="",n=0;
  D.b.forEach(band=>{
    const rows=band.r.filter(r=>{
      if(lv&&(r.lv||1)!==lv)return false;
      if(!kw)return true;
      return (r.t+" "+TAGS.map(t=>r[t[0]]||"").join(" ")).toLowerCase().includes(kw);
    });
    if(!rows.length)return;
    html+='<div class="band">'+esc(band.n)+'</div>';
    rows.forEach(r=>{
      n++;const st=r.lv||1;
      html+='<div class="card" data-k="'+n+'"><div class="ct"><span>'+rich(r.t)+'</span>'+
        '<span style="white-space:nowrap"><span class="star s'+st+'">'+"★".repeat(st)+'</span> '+
        '<button class="play" data-k="'+n+'">🔊</button></span></div>';
      TAGS.forEach(([k,lb,cv])=>{ if(!r[k])return;
        html+='<div class="line b-'+k+'"><span class="tg" style="background:var('+cv+')" title="'+LAB[k]+'">'+lb+'</span><span class="tx">'+rich(r[k])+'</span></div>';});
      html+='</div>';
    });
  });
  app.innerHTML=html||'<div class="empty">找不到符合的爭點</div>';
  document.getElementById("cnt").textContent="顯示 "+n+" 則";
  window.__rows=[...app.querySelectorAll(".card")];
  buildTOC();
}
function buildTOC(){
  const D=window.MOBAN[cur];
  let h='<div class="subj">'+esc(D.t)+'</div>';
  [...document.querySelectorAll(".band")].forEach((b,i)=>{
    b.id="b"+i;
    const nm=b.textContent, m=nm.match(/^(\d{2})｜(.*)$/)||["","",nm];
    let q=0,n=b.nextElementSibling;
    while(n&&n.classList.contains("card")){q++;n=n.nextElementSibling;}
    h+='<a href="#b'+i+'" data-b="'+i+'"><span class="num">'+m[1]+'</span>'+esc(m[2])+'<span class="qty">'+q+'</span></a>';
  });
  const t=document.getElementById("toc");t.innerHTML=h;
  t.onclick=e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();
    const el=document.getElementById("b"+a.dataset.b);
    if(el)el.scrollIntoView({block:"start",behavior:"smooth"});
    t.classList.remove("open");};
}
function syncTOC(){
  const bs=[...document.querySelectorAll(".band")].map((e,i)=>({i:String(i),y:e.getBoundingClientRect().top}));
  const act=bs.filter(b=>b.y<170).pop()||bs[0];
  document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("on",act&&a.dataset.b===act.i));
}
const PLAYLABEL="▶ 朗讀本頁";

/* ── 朗讀引擎（防 GC／防 15 秒斷線／watchdog 續播） ── */
let voices=[],pref=localStorage.getItem("mb_voice")||"",queue=[],qi=0,playing=false,keep=null,wd=null;
let utterRefs=[];               // 保留參考，避免被 GC 掉導致 onend 不觸發
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}
  const zh=voices.filter(v=>/^zh|^cmn|^yue/i.test(v.lang));const s=document.getElementById("voice");
  if(!s)return; s.innerHTML="";
  zh.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name;s.appendChild(o)});
  const mj=zh.find(v=>/Meijia|美佳/i.test(v.name));if(!pref&&mj)pref=mj.name;if(pref)s.value=pref;}
function best(){const zh=voices.filter(v=>/^zh|^cmn|^yue/i.test(v.lang));
  return zh.find(v=>v.name===pref)||zh.find(v=>/Meijia|美佳/i.test(v.name))||zh.find(v=>v.lang==="zh-TW")||zh[0]||null;}
function rateNow(){return parseFloat(document.getElementById("rate").value)||1.3;}
(function(){const r=document.getElementById("rate");if(!r)return;
  const sv=localStorage.getItem("mb_rate"); if(sv)r.value=sv;
  const lab=document.getElementById("ratev"); const show=()=>{if(lab)lab.textContent=(+r.value).toFixed(2)+"×";};
  show(); r.oninput=()=>{localStorage.setItem("mb_rate",r.value);show();};})();
function chunks(t){const out=[];let s="";
  String(t).replace(/\s+/g," ").split(/(?<=[。！？；：，])/).forEach(p=>{
    if((s+p).length>90){if(s)out.push(s);s=p}else s+=p});
  if(s.trim())out.push(s);return out.filter(x=>x.trim());}
function speakNext(){
  clearTimeout(wd);
  if(!playing){return;}
  if(qi>=queue.length){stopAll();return;}
  const it=queue[qi];
  if(!it.silent)highlight(it);
  const u=new SpeechSynthesisUtterance(it.text);
  u.lang="zh-TW"; u.rate=it.silent?2:rateNow(); if(it.silent)u.volume=0;
  const v=best(); if(v)u.voice=v;
  utterRefs.push(u); if(utterRefs.length>40)utterRefs.shift();
  let done=false;
  const go=()=>{ if(done)return; done=true; clearTimeout(wd); qi++; setTimeout(speakNext,20); };
  u.onend=go; u.onerror=go;
  const st=document.getElementById("st"); if(st)st.textContent=Math.max(1,qi)+" / "+(queue.length-1);
  try{ speechSynthesis.speak(u); }catch(e){ go(); return; }
  // watchdog：依字數估時長，逾時仍未結束就強制前進，避免整串卡死
  const est=Math.max(4000, it.text.length*(1000/(4.2*rateNow()))+4000);
  wd=setTimeout(()=>{ if(playing&&!done){ try{speechSynthesis.cancel()}catch(e){} go(); } },est);
}
function whenIdle(cb,n){n=n||0;
  try{ if(!speechSynthesis.speaking&&!speechSynthesis.pending)return cb(); }catch(e){ return cb(); }
  if(n>40)return cb();
  setTimeout(()=>whenIdle(cb,n+1),50);}
function start(list){
  try{speechSynthesis.cancel()}catch(e){}
  queue=[];qi=0;utterRefs=[];
  buildQueue(list);
  if(!queue.length)return;
  queue.unshift({text:"　",k:queue[0].k,first:false,silent:true});
  playing=true;
  const pp=document.getElementById("pp"); if(pp)pp.textContent="⏸ 暫停";
  clearInterval(keep);
  keep=setInterval(()=>{ if(!playing)return;
    if(speechSynthesis.speaking&&!speechSynthesis.paused){ try{speechSynthesis.pause();speechSynthesis.resume();}catch(e){} }
  },9000);
  whenIdle(()=>setTimeout(speakNext,120));
}
function stopAll(){playing=false;clearInterval(keep);clearTimeout(wd);
  try{speechSynthesis.cancel()}catch(e){}
  const pp=document.getElementById("pp"); if(pp)pp.textContent=PLAYLABEL;
  const st=document.getElementById("st"); if(st)st.textContent="";
  document.querySelectorAll(".now").forEach(e=>e.classList.remove("now"));}

function highlight(it){
  document.querySelectorAll(".now").forEach(e=>e.classList.remove("now"));
  const el=document.querySelector('.card[data-k="'+it.k+'"]');
  if(el){el.classList.add("now"); if(it.first&&!window.__noscroll)el.scrollIntoView({block:"center",behavior:"smooth"});}
}
function reapplyNow(){ if(playing&&queue[qi]){window.__noscroll=true;highlight(queue[qi]);window.__noscroll=false;} }
function cardText(el){
  const t=el.querySelector(".ct span").textContent.trim();
  let s="爭點。"+t+"。";
  el.querySelectorAll(".line").forEach(l=>{
    s+=l.querySelector(".tg").getAttribute("title")+"。"+l.querySelector(".tx").textContent.trim()+"。";});
  return s;
}
function buildQueue(list){
  list.forEach(el=>{const id=el.dataset.k;
    chunks(cardText(el)).forEach((c,k)=>queue.push({text:c,k:id,first:k===0}));});
}
/* ── 事件 ── */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");cur=b.dataset.s;localStorage.setItem("mb_subj",cur);stopAll();render();syncTOC();scrollTo(0,0);});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");lv=+b.dataset.lv;localStorage.setItem("mb_lv",b.dataset.lv);render();syncTOC();reapplyNow();});
document.getElementById("q").oninput=e=>{kw=e.target.value.trim().toLowerCase();render();syncTOC();reapplyNow();};
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest(".play"); if(!b)return;
  const card=b.closest(".card"), all=window.__rows||[], pos=all.indexOf(card);
  const cont=document.getElementById("contall").checked;
  stopAll(); start(cont&&pos>=0?all.slice(pos):[card]);});
document.getElementById("pp").onclick=()=>{
  if(playing){ if(speechSynthesis.paused){speechSynthesis.resume();document.getElementById("pp").textContent="⏸ 暫停";}
    else{speechSynthesis.pause();document.getElementById("pp").textContent="▶ 繼續";} return;}
  start(window.__rows||[]);};
document.getElementById("stop").onclick=stopAll;
document.getElementById("tocbtn").onclick=()=>document.getElementById("toc").classList.toggle("open");
addEventListener("scroll",()=>{clearTimeout(window.__st);window.__st=setTimeout(syncTOC,80)},{passive:true});
document.getElementById("voice").onchange=e=>{pref=e.target.value;localStorage.setItem("mb_voice",pref);};
(function(){let sc=parseFloat(localStorage.getItem("mb_scale")||"1");
  const v=document.getElementById("fsv");
  const app=()=>{document.documentElement.style.setProperty("--sc",sc);
    if(v)v.textContent=Math.round(sc*100)+"%";localStorage.setItem("mb_scale",sc);};
  document.getElementById("fsp").onclick=()=>{sc=Math.min(2,+(sc+0.1).toFixed(2));app();};
  document.getElementById("fsm").onclick=()=>{sc=Math.max(0.8,+(sc-0.1).toFixed(2));app();};
  app();})();
(function(){const el=document.getElementById("contall");if(el){
  const sv=localStorage.getItem("mb_contall"); if(sv!==null)el.checked=sv==="1";
  el.addEventListener("change",()=>localStorage.setItem("mb_contall",el.checked?"1":"0"));}
  const sc=localStorage.getItem("mb_subj"); if(sc&&window.MOBAN[sc]){cur=sc;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.s===sc));}
  const lvs=localStorage.getItem("mb_lv"); if(lvs!==null){lv=+lvs;
    document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.lv===lvs));}
})();
loadVoices(); if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
document.getElementById("tot").textContent=Object.values(window.MOBAN).reduce((a,s)=>a+s.b.reduce((x,b)=>x+b.r.length,0),0);
render();syncTOC();
</script></body></html>
