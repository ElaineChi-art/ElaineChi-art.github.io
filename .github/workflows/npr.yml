name: NPR 新聞英語每日更新

on:
  schedule:
    - cron: "40 21 * * *"     # 每天 21:40 UTC = 台灣 05:40，早上起來就有新文章
  workflow_dispatch:
    inputs:
      count:
        description: "要抓幾篇文章"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝相依套件
        run: pip install --quiet wordfreq
      - name: 抓取 NPR 文章並產生教材
        run: python judicial/_nprgen/npr_build.py ${{ github.event.inputs.count || '3' }}
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add judicial/npr-data.js judicial/npr-sudu-data.js judicial/nida.html
          git diff --staged --quiet || git commit -m "NPR 新聞英語每日更新"
          git push
